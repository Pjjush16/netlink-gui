name: Build NetLink GUI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output: netlink-gui-linux
          - os: windows-latest
            platform: windows
            output: netlink-gui-windows.exe
          - os: macos-latest
            platform: macos
            output: netlink-gui-macos
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Linux dependencies
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev xorg-dev

    - name: Download dependencies
      run: go mod download

    - name: Build
      shell: bash
      run: |
        if [ "${{ matrix.platform }}" == "windows" ]; then
          go build -ldflags="-s -w -H=windowsgui" -o ${{ matrix.output }} .
        else
          go build -ldflags="-s -w" -o ${{ matrix.output }} .
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}
        path: ${{ matrix.output }}

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Install Android dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev xorg-dev

    - name: Download dependencies
      run: go mod download

    - name: Install fyne
      run: go install fyne.io/fyne/v2/cmd/fyne@latest

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      run: |
        sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Build Android APK
      run: |
        fyne package -os android -appID com.netlink.gui -icon Icon.png -name "NetLink"
        # Find the generated APK file (fyne uses the name parameter)
        ls -la *.apk || true
        mv NetLink.apk netlink-gui-android.apk || mv *.apk netlink-gui-android.apk || true
        ls -la netlink-gui-android.apk

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: android
        path: netlink-gui-android.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          linux/netlink-gui-linux
          windows/netlink-gui-windows.exe
          macos/netlink-gui-macos
          android/netlink-gui-android.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
